name: reading_app
description: A Flutter reading app compatible with Legado book sources.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  sqflite: ^2.4.1
  dio: ^5.7.0
  gbk_codec: ^0.4.0
  flutter_js: ^0.8.7
  flutter_epub_viewer: ^1.2.2
  html: ^0.15.5
  flutter_tts: ^4.2.0
  just_audio: ^0.9.42
  audio_service: ^0.18.16
  go_router: ^14.8.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/book_sources/
