name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.24.5
        channel: stable
        cache: true
        cache-key: flutter-3.24.5-android-sdk
        cache-path: ~/.flutter
 
    - name: Verify Java
      run: java -version
    
    - name: Verify Flutter
      run: flutter --version
    
    - name: Create assets directory
      run: mkdir -p assets/book_sources
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Fix gradlew permission
      run: chmod +x android/gradlew
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
        cat android/local.properties
    
    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    
    - name: Pre-download Gradle distribution
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin || true
        gradle --version || echo "Gradle not installed, using wrapper only"
    
    - name: Run tests
      run: flutter test
      continue-on-error: true
    
    - name: Build APK (debug)
      run: flutter build apk --debug
    
    - name: Build APK (release)
      run: flutter build apk --release
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 90
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
